<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#232D42" stroke-width="8"/>
  
  <!-- Subtle grid lines -->
  <line x1="80" y1="180" x2="432" y2="180" stroke="#1E2638" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="80" y1="280" x2="432" y2="280" stroke="#1E2638" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="80" y1="380" x2="432" y2="380" stroke="#1E2638" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Candlesticks in background -->
  <!-- Candle 1: Bullish green -->
  <line x1="140" y1="190" x2="140" y2="370" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
  <rect x="124" y="230" width="32" height="90" rx="4" fill="url(#neonGlow)"/>

  <!-- Candle 2: Small red -->
  <line x1="210" y1="200" x2="210" y2="350" stroke="#F43F5E" stroke-width="4" stroke-linecap="round"/>
  <rect x="194" y="250" width="32" height="60" rx="4" fill="#F43F5E"/>

  <!-- Central Flash / Lightning Scalp Sigil -->
  <polygon points="310,90 200,270 280,270 230,420 370,230 290,230" fill="url(#goldGrad)" stroke="#FDE68A" stroke-width="4" stroke-linejoin="round"/>

  <!-- Upward Trend Line -->
  <path d="M 90 390 Q 200 340 280 270 T 430 130" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
  <polygon points="430,130 400,135 425,160" fill="#F59E0B"/>
</svg>
